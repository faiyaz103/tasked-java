server:
  port: 8080

spring:
  application:
    name: modular

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasked_java}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      # Development convenience: Hibernate reconciles the schema with the entities on boot,
      # which is how the new `refresh_token_expires_at` and `version` columns appear.
      # Production should move to `validate` with Flyway owning the DDL.
      ddl-auto: update
    open-in-view: false          # no lazy loading after the transaction closes
    properties:
      hibernate:
        jdbc:
          time_zone: UTC         # timestamps round-trip as UTC regardless of server locale

# ── Auth pipeline ──────────────────────────────────────────────────────────────────────
# Every value below is overridable by an environment variable. The inline defaults exist so
# a fresh clone runs; they are development values and MUST be overridden in any deployed
# environment. A secret committed to source control is a secret that has already leaked.
tasked:
  jwt:
    issuer: ${JWT_ISSUER:tasked-api}
    audience: ${JWT_AUDIENCE:tasked-app}

    # Two independent HS256 keys. This separation is what makes an access token unusable at
    # the refresh endpoint and a refresh token unusable as a Bearer credential: the signature
    # simply does not verify. Startup fails if these are equal or shorter than 32 bytes.
    access-secret: ${JWT_ACCESS_SECRET:dev-only-access-secret-change-me-in-production-0123456789}
    refresh-secret: ${JWT_REFRESH_SECRET:dev-only-refresh-secret-change-me-in-production-0123456789}

    # java.time.Duration (ISO-8601). Short access TTL bounds the damage of a stolen access
    # token, since sign-out cannot revoke one. Long refresh TTL keeps users logged in, and is
    # safe because every use rotates the token and a replay destroys the session.
    access-ttl: ${JWT_ACCESS_TTL:PT10M}
    refresh-ttl: ${JWT_REFRESH_TTL:PT15M}

cors:
  # Explicit list, not a wildcard: allowCredentials(true) is incompatible with "*".
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never       # do not leak infrastructure detail to anonymous callers

logging:
  level:
    org.springframework.security: INFO
